scope: hub MCP tools — serving the methods every hub a host serves, from hub_kernel-interface's one served list, as MCP tools at one JSON-RPC endpoint in a host Rails app, each call behind the host's own sign-in and hub_kernel-interface's permission check and account scope, with a boot check for hubs that cannot be served as tools

install:
  - gem "hub_kernel-mcp"
  - mount HubKernel::Mcp::Engine
  - HubKernel::Mcp.base_controller=
  - HubKernel::Mcp.person_method=
  - HubKernel::Mcp.account_method=
  - HubKernel::Mcp.check!
  - HubKernel::Mcp::UnservableHubError

develop:
  - POST /
  - initialize
  - ping
  - tools/list
  - tools/call

sources:
  - lib/hub_kernel/mcp.rb
  - lib/hub_kernel/mcp/engine.rb
  - config/routes.rb
  - app/controllers/hub_kernel/mcp/messages_controller.rb
  - README.md
