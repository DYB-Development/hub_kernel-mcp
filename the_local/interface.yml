  - db/migrate/20261009000002_add_last_used_at_to_hub_kernel_mcp_connections.rb
  - db/migrate/20261009000003_add_code_digest_to_hub_kernel_mcp_connections.rb
  - app/models/hub_kernel/mcp/client.rb
